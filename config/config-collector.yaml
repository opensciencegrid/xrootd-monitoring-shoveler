# Example configuration for xrootd-monitoring-collector
# The collector binary performs full packet parsing and correlation

# Input configuration
input:
  # Type of input: "udp" or "message_bus"
  type: udp
  # Optional: Override host/port (defaults to listen.ip/listen.port)
  # host: 0.0.0.0
  # port: 9993
  buffer_size: 65536
  
  # For message_bus input:
  # broker_url: amqp://guest:guest@localhost:5672/
  # topic: xrootd-packets
  # subscription: xrootd-shoveler
  # base64_encoded: true

# State management (collector mode only)
state:
  # Time-to-live for state entries in seconds (5 minutes default)
  entry_ttl: 300
  # Maximum number of state entries (0 for unlimited)
  max_entries: 10000
  # DNS enrichment settings (replaces reverse DNS lookup)
  # enable_dns_enrichment: false
  # dns_cache_ttl: 3600       # Time-to-live for DNS cache entries in seconds
  # enrichment_workers: 5     # Number of worker goroutines for DNS lookups
  # enrichment_queue_size: 1000000  # Max pending DNS lookups kept in memory
  # gstream_workers: 4        # Number of worker goroutines for gstream packet handling
  # gstream_queue_size: 20000 # Max pending gstream packets kept in memory
  # dns_timeout: 2            # DNS lookup timeout in seconds

# WLCG configuration
#
# wlcg.enabled turns on the settings a WLCG site needs. It is off by default, and
# while it is off none of the keys below do anything: records are converted by the
# upstream rule (VO "cms", or a path under /store or /user/dteam) and a record's
# "vo" is whatever the packet said. That is what lets OSG and WLCG share one
# collector.
#
# With it on, every record is converted as a WLCG record. vos and path_prefixes have no defaults,
# so nothing limits that unless you set them. 
#
# You can include, exclude specific VOs and path prefixes.
# You can also set the VO order in which the VO is determined (default is ["record", "scitags", "config"]).
# The first VO that is found is used.
#
# Environment variables use the COLLECTOR_WLCG_ prefix, for example
# COLLECTOR_WLCG_ENABLED and COLLECTOR_WLCG_EXCLUDE_VOS.
#
# wlcg:
#   enabled: true
#   vos: ["cms"]                              # only these VOs are included; unset means all
#   path_prefixes: ["/store"]                   # only these paths are included; unset means all
#   exclude_vos: ["dune", "belle2", "skao"]     # These VOs are excluded from the WLCG feed
#   exclude_path_prefixes: ["/pnfs/dune"]       # These path prefixes are excluded from the WLCG feed
#   vo: cms                                   # VO set for collector running at a specific VO. If not set, the VO is determined by the record, scitags, and config in the order of vo_order.
#   vo_order: ["record", "scitags", "config"]   # VO order to determine the resolution of the VO.
#
# Internal traffic flags. With wlcg.enabled on, every WLCG record also carries
# traffic_scope (LAN/WAN/UNKNOWN), site_internal_traffic (absent when the
# topology is unknown) and xrootd_internal_traffic. The rules below have general
# WLCG/XRootD defaults and only need setting at a site that names its system
# accounts or replication paths differently.
#
#   traffic_enabled: true                        # emit the three fields (default true)
#   traffic_internal_users: ["root"]             # accounts XRootD uses for its own work
#   traffic_job_agent_min: 1                     # numeric job-agent accounts...
#   traffic_job_agent_max: 8                     # ...set max below min to turn the rule off
#   traffic_replication_prefixes: ["replicate"]  # replication markers in the protocol, appinfo or path
#   traffic_case_sensitive: false                # match accounts and markers exactly as written

# Record drop filter (collector mode only)
# Records matching any VO (case-insensitive) OR any path prefix are dropped
# entirely and published to neither the main exchange nor the WLCG exchange.
# The drop filter is evaluated before WLCG routing.
# A Prometheus counter (shoveler_records_dropped{reason="vo|path_prefix"}) is incremented for each dropped record.
# Default is to drop nothing (empty lists).
# filter:
#   drop_vos: ["dune", "belle2", "skao"]     # These VOs are dropped from the WLCG feed
#   drop_path_prefixes: ["/pnfs/dune"]       # These path prefixes are dropped from the WLCG feed

# Src/dst site resolution (collector mode only)
# Resolves each end of a transfer to its WLCG RCSite (e.g. CERN-PROD, AGLT2) and
# stamps src_site/dst_site plus a per-endpoint *_site_status on the WLCG-formatted
# record, ordered by data-flow direction (read: src=server, dst=client; write:
# inverted). Records not routed to the WLCG exchange are untouched.
# Enabled by default using the CRIC snapshots embedded in the binary, so no
# network access is required.
# site:
#   enabled: true              # false disables all src_site/dst_site resolution
#
#   # The RCSite this collector runs at. Every server reporting to it is at that
#   # site by definition, so setting this resolves the server end with no lookup.
#   # Leave empty on a collector aggregating several sites.
#   local_site: ""
#   local_site_lan_clients: true  # also apply local_site to private/loopback clients
#
#   # Which identifiers are tried, in order; the first hit wins. Leaving a method
#   # out is how you turn it off. Examples assume local_site: CERN-PROD.
#   #   config   - local_site (above): the reporting server always, plus
#   #              private-address clients when local_site_lan_clients is set
#   #   hostname - exact CRIC SE endpoint host: root://xrootd.aglt2.org:1094
#   #   ip       - CRIC netroutes CIDR: 137.138.5.4 falls in 137.138.0.0/16
#   #   domain   - longest domain suffix: wn01.cern.ch -> cern.ch
#   # A name matching several sites (computecanada.ca matches three) yields the
#   # first of them with status "ambiguous", and the next method is still tried:
#   # a definite hit later in the order replaces the guess.
#   resolution_order: ["config", "hostname", "ip", "domain"]
#
#   # CRIC domains map ("" = the embedded snapshot; else a file path or URL).
#   source: ""
#   refresh_interval: 86400    # seconds between re-fetches of a URL source (0 disables)
#
#   # The site's own answer for an endpoint. OFF by default: a pin overrides every
#   # CRIC answer, so it must be switched on deliberately. It is the escape hatch
#   # for a CRIC entry you know is wrong, or one CRIC cannot disambiguate.
#   # Not part of resolution_order: it cannot be reordered or left out there.
#   # A key is an exact host, a domain suffix, an address, or a CIDR. The collector
#   # logs each ambiguous endpoint once with the exact line to add here.
#   overrides_enabled: false
#   overrides:
#     scotgrid.ac.uk: UKI-SCOTGRID-GLASGOW   # every host under the suffix
#     159.93.39.0/24: JINR-T1                # two sites declare this same range
#
#   # CRIC SE endpoints, backing the "hostname" method ("" = the embedded snapshot).
#   hostname_enabled: true
#   hostname_source: ""
#   hostname_refresh_interval: 86400
#
#   # CRIC netroutes, backing the "ip" method ("" = the embedded snapshot).
#   ip_enabled: true
#   ip_source: ""
#   ip_refresh_interval: 86400

# Select which protocol to use in order to connect to the MQ
# mq: amqp/stomp

# If using amqp protocol
amqp:
  url: amqps://username:password@example.com/vhost
  exchange: shoveled-xrd
  # GStream event exchanges
  exchange_cache: xrd-cache-events
  exchange_tcp: xrd-tcp-events
  exchange_tpc: xrd-tpc-events
  # WLCG formatted events (CMS VO or /store, /user/dteam paths)
  exchange_wlcg: xrd-wlcg-events
  topic:
  token_location: /etc/xrootd-monitoring-shoveler/token

# If using stomp protocol please configure the following commented lines as needed
#stomp:
#  user: username
#  password: password
#  url: messagebroker.org:port
#  topic: mytopic
#  cert: path/to/cert/file
#  certkey: path/to/certkey/file

# WLCG metadata holds the configurable producer/type values that are used
# in the "metadata" block of WLCG-formatted records.
# These identify the data source and differ between deployments; override them
# here instead of editing the code. Values below are the defaults, matching the
# OSG upstream collector (opensciencegrid/xrootd-monitoring-collector).
# Equivalent environment variables: COLLECTOR_WLCG_PRODUCER, COLLECTOR_WLCG_TYPE,
# COLLECTOR_WLCG_GSTREAM_PRODUCER.
#wlcg:
#  producer: cms                      # producer for file-transfer (file-close) records
#  type: aaa-ng                       # type for file-transfer records
#  gstream_producer: cms-xrootd-cache # producer for gstream cache & TPC records

listen:
  port: 9993
  ip: 0.0.0.0

# Where to foward udp messages, if necessary
# Multiple destinations supported
#outputs:
#  destinations:
#    - 127.0.0.1:1234

# Whether to verify the header of the packet matches XRootD's monitoring
# packet format (only applies to shoveling mode, collector mode always parses)
verify: true

# Export prometheus metrics
metrics:
  enable: true
  port: 8000

# Enable pprof profiling (for troubleshooting/debugging)
# Access at http://host:port/debug/pprof/
profile:
  enable: false
  port: 3030

# Directory to store overflow of queue onto disk.
# The queue keeps 100 messages in memory.  If the shoveler is disconnected from the message bus,
# it will store messages over the 100 in memory onto disk into this directory.  Once the connection has been re-established
# the queue will be emptied.  The queue on disk is persistent between restarts, so a persistent directory should be used.
queue_directory: /var/spool/xrootd-monitoring-shoveler/queue

# Mapping configuration
# If map.all is set, all messages will be mapped to the configured origin.
# For example, with the configuration
# map:
#   all: 172.0.0.4
# If a packet comes in with the private ip address of 192.168.0.4, the packet origin will be changed to 172.0.0.4
# The port is always preserved.
# If you want multiple mappings, you can specify multiple map entries.
# For example, with the configuration
# map:
#   192.168.0.5: 172.0.0.5
#   192.168.0.6: 129.93.10.7
